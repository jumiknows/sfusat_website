name: Maintenance task
description: Track cleanup, dependencies or repository maintenance
title: "Maintenance: "

body:
  - type: textarea
    id: task
    attributes:
      label: What needs maintenance?
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why is this needed?
      description: Explain the risk, cleanup or recurring problem.

  - type: textarea
    id: done
    attributes:
      label: Completion check
      description: Describe how someone can verify the task is complete.
