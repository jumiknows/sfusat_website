name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: sfusat-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run code checks
        run: npm run check

      - name: Install Chromium for smoke test
        run: npx --yes playwright@1.63.0 install chromium

      - name: Start built site
        run: python3 -m http.server 4173 --directory build >/tmp/sfusat-http.log 2>&1 &

      - name: Wait for built site
        run: curl --retry 10 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:4173 >/dev/null

      - name: Run browser smoke test
        run: npx --yes playwright@1.63.0 screenshot --browser chromium --wait-for-timeout 1000 http://127.0.0.1:4173 /tmp/sfusat-home.png
